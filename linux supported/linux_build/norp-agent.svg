<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="16" y="24" width="96" height="80" rx="8" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="16" y="24" width="96" height="18" rx="8" fill="#161b22"/>
  <rect x="16" y="34" width="96" height="8" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="28" cy="33" r="4" fill="#ff5f57"/>
  <circle cx="40" cy="33" r="4" fill="#febc2e"/>
  <circle cx="52" cy="33" r="4" fill="#28c840"/>
  <!-- Code lines -->
  <rect x="26" y="48" width="14" height="4" rx="2" fill="#7b2ff7"/>
  <rect x="44" y="48" width="30" height="4" rx="2" fill="#00d4ff" opacity="0.8"/>
  <rect x="26" y="58" width="24" height="4" rx="2" fill="#7b2ff7"/>
  <rect x="54" y="58" width="42" height="4" rx="2" fill="#e0e0e0" opacity="0.6"/>
  <rect x="26" y="68" width="8" height="4" rx="2" fill="#ff79c6"/>
  <rect x="38" y="68" width="36" height="4" rx="2" fill="#e0e0e0" opacity="0.6"/>
  <rect x="26" y="78" width="18" height="4" rx="2" fill="#7b2ff7"/>
  <rect x="48" y="78" width="28" height="4" rx="2" fill="#00d4ff" opacity="0.7"/>
  <!-- Cursor -->
  <rect x="78" y="78" width="3" height="4" rx="1" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Sparkle top right -->
  <text x="96" y="52" font-size="14" fill="#ffd700" opacity="0.9">✦</text>
</svg>
